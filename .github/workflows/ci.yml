name: CI

# Build, test, lint, and format-check on every push and pull request.
# Separate from release.yml, which only builds distributable binaries on
# tagged releases.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    uses: ./.github/workflows/reusable-test.yml
    with:
      os: ${{ matrix.os }}
      lint: ${{ matrix.os == 'ubuntu-latest' }}

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit
