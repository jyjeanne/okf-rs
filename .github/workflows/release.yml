name: Release

# Verifies the tag matches the crate version and the full test suite passes,
# then builds standalone `okf-rs` CLI binaries (with sha256 checksums) for
# Linux, macOS, and Windows and attaches them to the GitHub Release for the
# pushed tag. Triggered by pushing a tag like `v0.1.0`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$crate_version" ]; then
            echo "::error::Tag v$tag does not match workspace.package.version ($crate_version) in Cargo.toml"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --locked

  build:
    needs:
      - test
      - check-version
    # `check-version` is skipped on workflow_dispatch runs; only require it to
    # have succeeded, never to have run.
    if: always() && needs.test.result == 'success' && needs.check-version.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - name: Build release binary
        run: cargo build --release --locked -p okf-cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          bin_dir=target/${{ matrix.target }}/release
          name=okf-rs-${{ matrix.target }}
          mkdir -p dist
          tar -czf dist/${name}.tar.gz -C "$bin_dir" okf-rs

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          bin_dir=target/${{ matrix.target }}/release
          name=okf-rs-${{ matrix.target }}
          mkdir -p dist
          (cd "$bin_dir" && 7z a -tzip "${GITHUB_WORKSPACE}/dist/${name}.zip" okf-rs.exe)

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: okf-rs-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
