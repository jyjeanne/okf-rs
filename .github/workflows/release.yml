name: Release

# Verifies the tag matches the crate version and the full test suite passes,
# then builds standalone `okf-rs` CLI binaries (with sha256 checksums) for
# Linux, macOS, and Windows and attaches them to the GitHub Release for the
# pushed tag. Triggered by pushing a tag like `v0.1.0`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to publish the release for, e.g. v0.1.0 (required for manual runs; ignored on tag pushes)"
        required: true

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Resolve the actual released package's version via cargo, rather than
      # grepping Cargo.toml text, so this stays correct even if okf-cli ever
      # stops inheriting workspace.package.version. Skipped (not failed) on
      # workflow_dispatch, which has no tag to check.
      - name: Verify tag matches okf-cli version
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg_version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "okf-cli") | .version')
          if [ "$tag" != "$pkg_version" ]; then
            echo "::error::Tag v$tag does not match okf-cli version ($pkg_version)"
            exit 1
          fi

  test:
    uses: ./.github/workflows/reusable-test.yml
    with:
      os: ubuntu-latest
      lint: false

  build:
    needs:
      - test
      - check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
          rustup default stable

      - name: Build release binary
        run: cargo build --release --locked -p okf-cli --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          bin_dir=target/${{ matrix.target }}/release
          name=okf-rs-${{ matrix.target }}
          mkdir -p dist
          tar -czf dist/${name}.tar.gz -C "$bin_dir" okf-rs

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          bin_dir=target/${{ matrix.target }}/release
          name=okf-rs-${{ matrix.target }}
          mkdir -p dist
          (cd "$bin_dir" && 7z a -tzip "${GITHUB_WORKSPACE}/dist/${name}.zip" okf-rs.exe)

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: okf-rs-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          files: dist/*
          generate_release_notes: true
