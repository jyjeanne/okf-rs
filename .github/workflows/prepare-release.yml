name: Prepare Release

# Manually triggered: bumps the workspace version, commits, and pushes a
# `vX.Y.Z` tag. Pushing that tag then kicks off release.yml, which builds
# and publishes the actual GitHub Release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading 'v' (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: prepare-release

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid semver version (expected e.g. 1.2.3)"
            exit 1
          fi
          # Check the remote directly rather than the local clone, which
          # actions/checkout fetches without tags by default.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Bump workspace version
        run: |
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\"/version = \"$VERSION\"/" Cargo.toml
          if ! grep -qF "version = \"$VERSION\"" Cargo.toml; then
            echo "::error::Failed to bump version in Cargo.toml (pattern did not match)"
            exit 1
          fi

      - name: Update Cargo.lock
        run: cargo check --workspace

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v$VERSION"
