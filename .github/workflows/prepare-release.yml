name: Prepare Release

# Automates the *start* of a release: bump the workspace version, commit,
# and push a `vX.Y.Z` tag. release.yml already does the rest (build
# cross-platform binaries and publish the GitHub Release) triggered by
# that tag push -- this workflow exists only to close the remaining
# manual gap, so cutting a release is "run this with a version number"
# instead of hand-editing Cargo.toml and running git tag/push locally.
#
# Manually triggered (never automatic) so a maintainer decides exactly
# when a release ships.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 (no leading v)"
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          version="${{ github.event.inputs.version }}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (no leading v), got '$version'"
            exit 1
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::tag v$version already exists"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Bump workspace version
        run: |
          version="${{ github.event.inputs.version }}"
          # The only `version = "..."` line in the root manifest is
          # `[workspace.package]`'s -- every crate inherits it via
          # `version.workspace = true` -- so an unscoped substitution is
          # safe here.
          sed -i "s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          grep -q "version = \"$version\"" Cargo.toml

      - name: Refresh Cargo.lock
        run: cargo check --workspace

      - name: Commit and tag
        run: |
          version="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release v$version"
          git tag "v$version"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v$version"
